<style>
/* Layout idea: one phone-width column, one task per screen, big touch targets, bottom tab bar. */
:root {
  --bg: #F2F7F3;
  --surface: #FFFFFF;
  --surface2: #E8F1EA;
  --ink: #111A14;
  --muted: #56665B;
  --line: #D6E3D9;
  --leaf: #2E7D32;
  --leaf-ink: #FFFFFF;
  --leaf-soft: #E0F1DC;
  --sun: #A9741A;
  --sun-soft: #F6EBD0;
  --water: #1F56D8;
  --water-soft: #E2EAFD;
  --good: #256B2A;
  --good-soft: #E0F1DC;
  --warn: #A85F0A;
  --warn-soft: #FBEBD2;
  --bad: #B03A2E;
  --bad-soft: #F8DEDA;
  --shadow: 0 1px 2px rgba(22, 36, 27, .06), 0 6px 18px rgba(22, 36, 27, .06);
  --stage: #DCE7F5;
  --font: "IBM Plex Sans Arabic", "Noto Sans Arabic", Tahoma, "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1712; --surface: #17211A; --surface2: #1E2A21; --ink: #E7EFE9; --muted: #9DB0A2; --line: #2A3A2E;
    --leaf: #6CCB5F; --leaf-ink: #0C1A11; --leaf-soft: #1D3A1F; --sun: #E0AE55; --sun-soft: #3A3017;
    --water: #7FA6FF; --water-soft: #17213D; --good: #6CCB5F; --good-soft: #17301F; --warn: #E3A04C; --warn-soft: #3A2B12;
    --bad: #EE8A7E; --bad-soft: #3B1D1A; --shadow: 0 1px 2px rgba(0,0,0,.4);
    --stage: #090E0B; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1712; --surface: #17211A; --surface2: #1E2A21; --ink: #E7EFE9; --muted: #9DB0A2; --line: #2A3A2E;
  --leaf: #6CCB5F; --leaf-ink: #0C1A11; --leaf-soft: #1D3A1F; --sun: #E0AE55; --sun-soft: #3A3017;
  --water: #7FA6FF; --water-soft: #17213D; --good: #6CCB5F; --good-soft: #17301F; --warn: #E3A04C; --warn-soft: #3A2B12;
  --bad: #EE8A7E; --bad-soft: #3B1D1A; --shadow: 0 1px 2px rgba(0,0,0,.4);
  --stage: #090E0B; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.55; -webkit-text-size-adjust: 100%; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--water); outline-offset: 2px; }

/* phone frame on wide screens, full-bleed on real phones */
#stage { height: 100%; display: flex; align-items: center; justify-content: center; padding: 16px; background: var(--stage); }
#phone { width: 390px; height: min(844px, 100%); display: flex; flex-direction: column; background: var(--surface); border: 11px solid #0E1210; border-radius: 52px; overflow: hidden; position: relative;
  box-shadow: 0 0 0 2px #2B332E, 0 24px 60px rgba(10, 20, 14, .35); }
#phone .notch { position: absolute; top: 9px; left: 50%; transform: translateX(-50%); width: 104px; height: 28px; background: #0E1210; border-radius: 16px; z-index: 30; }
#phone .statusbar { flex: none; display: flex; justify-content: space-between; align-items: center; padding: 14px 28px 6px; font-size: 14px; font-weight: 600; background: var(--surface); color: var(--ink); direction: ltr; }
#phone .statusbar svg { width: 16px; height: 16px; }
#phone .statusbar .sb { display: flex; gap: 6px; align-items: center; }
#app { flex: 1; min-height: 0; width: 100%; display: flex; flex-direction: column; background: var(--bg); position: relative; }
@media (max-width: 430px), (hover: none) and (pointer: coarse) and (max-width: 900px) {
  #stage { padding: 0; }
  #phone { width: 100%; height: 100%; border: 0; border-radius: 0; box-shadow: none; }
  #phone .notch, #phone .statusbar { display: none; }
}

.topbar { display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: var(--surface); border-bottom: 1px solid var(--line); flex: none; }
.logo { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; border: 0; background: transparent; color: var(--leaf); font-size: 21px; font-weight: 700; padding: 0 4px; border-radius: 12px; }
.logo svg { width: 26px; height: 26px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 2px 10px; font-size: 13px; font-weight: 600; background: var(--sun-soft); color: var(--sun); white-space: nowrap; }
.chip.view { background: var(--water-soft); color: var(--water); }
.iconbtn { min-width: 44px; min-height: 44px; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; font-weight: 600; padding: 0 12px; }

main { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.demo-note { font-size: 13px; color: var(--muted); background: var(--sun-soft); border-radius: 10px; padding: 8px 12px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 10px; }
.card.tap { cursor: pointer; text-align: start; width: 100%; }
.card h2, .card h3 { margin: 0; font-size: 17px; }
.row { display: flex; align-items: center; gap: 10px; }
.row.between { justify-content: space-between; }
.muted { color: var(--muted); font-size: 14px; }
.small { font-size: 13px; }
.grow { flex: 1; min-width: 0; }
h2.screen-title { font-size: 22px; margin: 0; }
p.lead { margin: 0; color: var(--muted); }

.btn { min-height: 48px; border-radius: 14px; border: 0; padding: 0 18px; font-weight: 700; background: var(--leaf); color: var(--leaf-ink); }
.btn.secondary { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
.btn.ghost { background: transparent; color: var(--leaf); border: 1px dashed var(--leaf); }
.btn.danger { background: var(--bad-soft); color: var(--bad); }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }

.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.opt { min-height: 56px; border: 2px solid var(--line); background: var(--surface); border-radius: 14px; padding: 10px 12px; text-align: start; display: flex; flex-direction: column; gap: 2px; font-weight: 600; }
.opt .sub { font-weight: 400; color: var(--muted); font-size: 13px; }
.opt[aria-pressed="true"] { border-color: var(--leaf); background: var(--leaf-soft); }
.tag { font-size: 12px; color: var(--muted); font-weight: 500; }

.stepper { display: flex; gap: 6px; }
.stepper i { height: 6px; flex: 1; border-radius: 3px; background: var(--line); }
.stepper i.on { background: var(--leaf); }

label.field { display: flex; flex-direction: column; gap: 6px; font-weight: 600; }
input[type="text"], input[type="password"], input[type="date"], select { min-height: 48px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); padding: 0 12px; width: 100%; }

.bottom { flex: none; display: flex; gap: 10px; padding: 12px 16px; background: var(--surface); border-top: 1px solid var(--line); }
.bottom .btn { flex: 1; }
.tabs { flex: none; display: flex; background: var(--surface); border-top: 1px solid var(--line); }
.tabs button { flex: 1; min-height: 56px; border: 0; background: transparent; color: var(--muted); font-weight: 600; font-size: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
.tabs button[aria-current="page"] { color: var(--leaf); box-shadow: inset 0 3px 0 var(--leaf); }
.tabs svg { width: 22px; height: 22px; }

.kv { display: flex; flex-direction: column; gap: 2px; padding: 8px 0; border-top: 1px solid var(--line); }
.kv:first-of-type { border-top: 0; padding-top: 0; }
.kv .k { font-size: 13px; color: var(--muted); font-weight: 600; }
.kv .v { font-size: 17px; font-weight: 700; }
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 3px 12px; font-size: 14px; font-weight: 700; }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.cond { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.water { background: var(--water-soft); color: var(--water); }

.verdict { border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 8px; border: 2px solid transparent; }
.verdict.good { background: var(--good-soft); border-color: var(--good); }
.verdict.cond { background: var(--warn-soft); border-color: var(--warn); }
.verdict.bad { background: var(--bad-soft); border-color: var(--bad); }
.verdict .big { font-size: 24px; font-weight: 700; }

ul.reasons { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
ul.reasons li { display: flex; gap: 10px; align-items: flex-start; }
ul.reasons li::before { content: ""; flex: none; width: 10px; height: 10px; margin-top: 8px; border-radius: 50%; background: var(--good); }
ul.reasons.warn li::before { background: var(--warn); border-radius: 2px; transform: rotate(45deg); }

.window { background: var(--sun-soft); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; }
.window .big { font-size: 24px; font-weight: 700; color: var(--sun); }

.review { display: flex; gap: 10px; align-items: flex-start; border-radius: 12px; padding: 10px 12px; font-size: 14px; }
.review.ok { background: var(--good-soft); color: var(--good); }
.review.no { background: var(--warn-soft); color: var(--warn); }
.review button { margin-inline-start: auto; border: 0; background: transparent; color: inherit; text-decoration: underline; min-height: 32px; font-size: 13px; }

.warnbox { border-radius: 12px; padding: 10px 12px; font-weight: 600; background: var(--bad-soft); color: var(--bad); }
.warnbox.rain { background: var(--water-soft); color: var(--water); }
.warnbox.wind { background: var(--warn-soft); color: var(--warn); }

.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chips .opt { min-height: 40px; padding: 4px 12px; border-radius: 999px; border-width: 1px; font-size: 14px; }

.fc { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.fc div { background: var(--surface2); border-radius: 10px; padding: 6px 2px; text-align: center; font-size: 13px; display: flex; flex-direction: column; gap: 0; }
.fc b { font-size: 15px; font-variant-numeric: tabular-nums; }

.wa { background: #E3F1DF; color: #17321C; border-radius: 14px 14px 14px 4px; padding: 10px 12px; font-size: 15px; max-width: 92%; }
:root[data-theme="dark"] .wa { background: #1E3A24; color: #DDEFD9; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .wa { background: #1E3A24; color: #DDEFD9; } }

.switch { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 48px; }
.switch button { width: 54px; height: 32px; border-radius: 999px; border: 0; background: var(--line); position: relative; flex: none; }
.switch button::after { content: ""; position: absolute; top: 4px; inset-inline-start: 4px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .15s; }
.switch button[aria-checked="true"] { background: var(--leaf); }
.switch button[aria-checked="true"]::after { transform: translateX(22px); }
[dir="rtl"] .switch button[aria-checked="true"]::after { transform: translateX(-22px); }

.bars { display: flex; flex-direction: column; gap: 8px; }
.bar { display: grid; grid-template-columns: 82px 1fr 44px; align-items: center; gap: 8px; font-size: 14px; }
.bar .track { height: 12px; background: var(--surface2); border-radius: 6px; overflow: hidden; }
.bar .fill { height: 100%; background: var(--leaf); border-radius: 6px; }
.bar .fill.alt { background: var(--water); }
.bar .num { text-align: end; font-variant-numeric: tabular-nums; font-weight: 700; }
.hidden-n { color: var(--muted); font-size: 12px; font-weight: 500; }

svg.chart { width: 100%; height: auto; display: block; }
svg.chart text { fill: var(--muted); font-size: 11px; font-family: var(--font); }
svg.chart .gridl { stroke: var(--line); stroke-width: 1; }

.sheet-wrap { position: absolute; inset: 0; background: rgba(10, 18, 13, .5); display: flex; align-items: flex-end; z-index: 10; }
.sheet { background: var(--surface); width: 100%; border-radius: 20px 20px 0 0; padding: 18px 16px 22px; max-height: 85%; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }

.login { justify-content: center; }
.mark svg { width: 34px; height: 34px; }
.mark { width: 64px; height: 64px; border-radius: 18px; background: var(--leaf); color: var(--leaf-ink); display: grid; place-items: center; }
.empty { text-align: center; color: var(--muted); padding: 24px 0; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface2); border-radius: 14px; padding: 4px; gap: 4px; }
.seg button { min-height: 44px; border: 0; border-radius: 10px; background: transparent; font-weight: 700; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--leaf); box-shadow: var(--shadow); }
input.code { text-align: center; font-size: 26px; letter-spacing: 10px; font-weight: 700; min-height: 56px; }
.sms { position: absolute; top: 8px; inset-inline: 10px; z-index: 25; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 10px 12px; display: flex; gap: 10px; align-items: flex-start; box-shadow: 0 8px 28px rgba(10, 20, 14, .28); animation: slidein .35s ease-out; }
.smsic { width: 36px; height: 36px; border-radius: 10px; background: var(--leaf); color: var(--leaf-ink); display: grid; place-items: center; flex: none; }
.smsic svg { width: 20px; height: 20px; }
@keyframes slidein { from { transform: translateY(-24px); opacity: 0; } to { transform: none; opacity: 1; } }

/* ---------- welcome + auth ---------- */
.welcome { gap: 16px; }
.welcome .hero { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; padding: 28px 8px 8px; }
.welcome .hero .mark { width: 76px; height: 76px; border-radius: 22px; }
.welcome .hero .mark svg { width: 40px; height: 40px; }
.welcome .hero h2.screen-title { font-size: 26px; }
.choice { position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; text-align: start; width: 100%; padding: 16px 52px 16px 18px; border-radius: 18px;
  border: 2px solid var(--line); background: var(--surface); box-shadow: var(--shadow); }
[dir="rtl"] .choice { padding: 16px 18px 16px 52px; }
.choice .ct { font-size: 19px; font-weight: 700; }
.choice .cs { color: var(--muted); font-size: 14px; }
.choice .arr { position: absolute; top: 50%; inset-inline-end: 18px; transform: translateY(-50%); font-size: 22px; font-weight: 700; color: var(--leaf); }
.choice.primary { background: var(--leaf); border-color: var(--leaf); color: var(--leaf-ink); }
.choice.primary .cs, .choice.primary .arr { color: var(--leaf-ink); opacity: .9; }
.linkbtn { border: 0; background: transparent; color: var(--leaf); font-weight: 700; text-decoration: underline; min-height: 44px; align-self: center; }
.center { text-align: center; }
.stack { display: flex; flex-direction: column; gap: 10px; }

/* ---------- map ---------- */
.map { height: 250px; border-radius: 14px; border: 1px solid var(--line); overflow: hidden; position: relative; z-index: 0; isolation: isolate; flex: none; }
.btn svg { width: 18px; height: 18px; vertical-align: -3px; }

/* ---------- toast ---------- */
.toast { position: absolute; bottom: 84px; inset-inline: 16px; z-index: 26; background: var(--leaf); color: var(--leaf-ink); border-radius: 14px; padding: 12px 14px; font-weight: 700; box-shadow: 0 8px 28px rgba(10, 20, 14, .28); animation: slidein .3s ease-out; }

/* ---------- plan comparison ---------- */
.plans { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 6px; }
.plans.n2, .cvals.n2 { grid-template-columns: repeat(2, 1fr); }
.plans.n1, .cvals.n1 { grid-template-columns: 1fr; }
.plan { position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 16px 6px 10px; border-radius: 16px; border: 2px solid var(--line); background: var(--surface); box-shadow: var(--shadow); text-align: center; }
.plan.sel { border-color: var(--leaf); background: var(--leaf-soft); }
.plan .pcrop { font-size: 17px; font-weight: 700; line-height: 1.2; }
.plan .pill { font-size: 12px; padding: 2px 8px; }
.crown { position: absolute; top: -11px; left: 50%; transform: translateX(-50%); background: var(--good); color: #fff; font-size: 11px; font-weight: 700; padding: 1px 10px; border-radius: 999px; white-space: nowrap; }
.plabel { font-size: 11.5px; font-weight: 700; color: var(--water); }
.plan.mine .plabel, .plabel.mine { color: var(--sun); }
summary .plabel { display: inline-block; background: var(--water-soft); padding: 1px 8px; border-radius: 999px; margin-inline-end: 4px; }
summary .plabel.mine { background: var(--sun-soft); }
details.card summary { font-weight: 700; cursor: pointer; }
svg.ring { width: 58px; height: 58px; }
svg.ring .tr { fill: none; stroke: var(--surface2); stroke-width: 6; }
svg.ring .fg { fill: none; stroke-width: 6; stroke-linecap: round; stroke: var(--good); }
svg.ring.cond .fg { stroke: var(--warn); }
svg.ring.bad .fg { stroke: var(--bad); }
svg.ring text { font-size: 16px; font-weight: 700; fill: var(--ink); font-family: var(--font); }
.cmp { gap: 0; }
.cmp h3 { margin-bottom: 8px !important; }
.cvals { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.cvals.head { position: sticky; top: -16px; background: var(--surface); padding: 6px 0; z-index: 1; }
.ch { text-align: center; font-weight: 700; font-size: 14px; color: var(--muted); }
.ch.sel { color: var(--leaf); }
.crow { padding: 9px 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 5px; }
.clabel { font-size: 13px; font-weight: 700; color: var(--muted); }
.cv { text-align: center; font-size: 14px; font-weight: 600; padding: 6px 4px; border-radius: 10px; background: var(--surface2); line-height: 1.3; display: flex; flex-direction: column; justify-content: center; font-variant-numeric: tabular-nums; }
.cv small { font-weight: 400; color: var(--muted); font-size: 11.5px; }
.cv.win { background: var(--good-soft); color: var(--good); }
.cv.win::after { content: "✓"; font-size: 12px; }
.cv.sel { outline: 2px solid var(--leaf); outline-offset: -2px; }
.cmp > p.muted { margin-top: 10px !important; }

/* ---------- clarity pass ---------- */
.card.focus { border: 2px solid var(--leaf); }
.big-line { font-size: 18px; font-weight: 700; }
.sowrow { align-items: flex-end; }
.sowrow .btn { flex: none; }
.landline { display: flex; align-items: center; gap: 8px; background: var(--surface2); border-radius: 12px; padding: 6px 12px; font-size: 13px; font-weight: 600; color: var(--muted); }
details.demo { border-top: 1px dashed var(--line); padding-top: 8px; }
details.demo summary { font-size: 13px; font-weight: 700; color: var(--muted); cursor: pointer; }

.brandlogo { width: 34px; height: 34px; flex: none; }
.hero-logo { width: 150px; height: 150px; filter: drop-shadow(0 6px 14px rgba(31, 86, 216, .18)); }
.logo span:last-child { color: var(--ink); }

/* ---------- weather: this week's event + real dates ---------- */
.event { display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; border-radius: 12px; background: var(--water-soft); }
.event b { font-size: 16px; color: var(--water); }
.event.heat { background: var(--warn-soft); } .event.heat b { color: var(--warn); }
.event.cold { background: var(--water-soft); }
.event.wind { background: var(--sun-soft); } .event.wind b { color: var(--sun); }
.fc small { font-size: 11px; color: var(--muted); }

/* ---------- WhatsApp-style assistant + voice ---------- */
.wa-top { flex: none; display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: #075E54; color: #fff; }
.wa-top .small { opacity: .85; }
.wa-back { border: 0; background: transparent; color: #fff; min-width: 36px; }
.wa-av { width: 38px; height: 38px; border-radius: 50%; background: #25D366; display: grid; place-items: center; color: #fff; flex: none; }
.wa-av svg { width: 22px; height: 22px; }
main.wa-chat { background: #ECE5DD; background-image: radial-gradient(rgba(0,0,0,.05) 1px, transparent 1px); background-size: 14px 14px; gap: 8px; padding: 12px; }
.wab { max-width: 84%; padding: 7px 10px 4px; border-radius: 10px; font-size: 15px; line-height: 1.6; white-space: pre-line; box-shadow: 0 1px 1px rgba(0,0,0,.12); color: #111; }
.wab.bot { align-self: flex-end; background: #fff; border-start-end-radius: 2px; }
[dir="ltr"] .wab.bot { align-self: flex-start; }
.wab.me { align-self: flex-start; background: #DCF8C6; border-start-start-radius: 2px; }
[dir="ltr"] .wab.me { align-self: flex-end; }
.wab time { display: block; font-size: 10px; color: #667; text-align: end; margin-top: 2px; }
.watool { font-size: 11px; color: #128C7E; font-weight: 700; }
.wa-quick { flex: none; display: flex; gap: 6px; overflow-x: auto; padding: 8px 10px; background: #ECE5DD; scrollbar-width: none; }
.wa-quick button { flex: none; border: 1px solid #b9d7c9; background: #fff; color: #075E54; border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; }
.wa-input { flex: none; display: flex; gap: 6px; padding: 8px 10px 12px; background: #ECE5DD; }
.wa-input input { flex: 1; min-height: 46px; border-radius: 999px; border: 0; padding: 0 16px; background: #fff; color: #111; }
.wa-send { width: 46px; height: 46px; border-radius: 50%; border: 0; background: #128C7E; color: #fff; font-size: 18px; flex: none; }
.wa-send.mic.live { background: #d83f3a; animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 10px rgba(216,63,58,.2); } }
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
.wa-note { flex: none; text-align: center; font-size: 11.5px; color: #54656f; background: #ECE5DD; padding: 0 8px 6px; }
.wavoice { display: flex; align-items: center; gap: 8px; min-width: 170px; }
.wvplay { width: 30px; height: 30px; border-radius: 50%; background: #128C7E; color: #fff; display: grid; place-items: center; font-size: 15px; flex: none; }

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function rn(id) { return E.REGION[id][st.lang]; }

  function partOfMonth(doy) { var d = E.dayOfMonth(doy); return t(d <= 10 ? 'pmEarly' : d <= 20 ? 'pmMid' : 'pmLate', { m: mon(E.monthOf(doy)) }); }
  function winText(w) {
    if (!w) return '';

    return w.startM === w.endM ? w.startD + '–' + w.endD + ' ' + mon(w.startM) : w.startD + ' ' + mon(w.startM) + ' – ' + w.endD + ' ' + mon(w.endM);

  /* ---------------- charts ---------------- */
  function chart(vals, kind, color) {
    var W = 300, H = 112, pl = 28, pr = 8, pt = 10, pb = 20, mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals);
    var lo = kind === 'bar' ? 0 : Math.floor(mn - (mx - mn) * 0.15), hi = Math.ceil(mx + (mx - mn) * 0.1);
    if (hi === lo) hi = lo + 1;
    function X(i) { return pl + (W - pl - pr) * (i + 0.5) / 12; }
    function Y(v) { return pt + (H - pt - pb) * (1 - (v - lo) / (hi - lo)); }
    var s = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="chart">';
    s += '<line class="gridl" x1="' + pl + '" x2="' + (W - pr) + '" y1="' + Y(lo) + '" y2="' + Y(lo) + '"/><line class="gridl" x1="' + pl + '" x2="' + (W - pr) + '" y1="' + Y(hi) + '" y2="' + Y(hi) + '"/>';
    s += '<text x="' + (pl - 4) + '" y="' + (Y(hi) + 4) + '" text-anchor="end">' + hi + '</text><text x="' + (pl - 4) + '" y="' + (Y(lo) + 4) + '" text-anchor="end">' + lo + '</text>';
    if (kind === 'bar') {
      var bw = (W - pl - pr) / 12 * 0.62;
      vals.forEach(function (v, i) { s += '<rect x="' + (X(i) - bw / 2) + '" y="' + Y(v) + '" width="' + bw + '" height="' + Math.max(0, Y(lo) - Y(v)) + '" rx="2" fill="' + color + '"/>'; });
    } else {
      var pts = vals.map(function (v, i) { return X(i) + ',' + Y(v); }).join(' ');
      s += '<polygon points="' + X(0) + ',' + Y(lo) + ' ' + pts + ' ' + X(11) + ',' + Y(lo) + '" fill="' + color + '" opacity=".14"/>';
      s += '<polyline points="' + pts + '" fill="none" stroke="' + color + '" stroke-width="2.5" stroke-linejoin="round"/>';
      var mi = vals.indexOf(mx), anc = mi <= 1 ? 'start' : mi >= 10 ? 'end' : 'middle', ax = mi <= 1 ? X(mi) + 6 : mi >= 10 ? X(mi) - 6 : X(mi);
      s += '<circle cx="' + X(mi) + '" cy="' + Y(mx) + '" r="4" fill="' + color + '"/><text x="' + ax + '" y="' + (Y(mx) - 7) + '" text-anchor="' + anc + '">' + num(mx, 1) + '</text>';
    }
    [0, 2, 4, 6, 8, 10].forEach(function (i) { s += '<text x="' + X(i) + '" y="' + (H - 5) + '" text-anchor="middle">' + (i + 1) + '</text>'; });
    return s + '</svg>';
  }

  /* ---------- result: the farmer's last plan against two NASA plans ---------- */
  function ring(score, verdict) {
    var r = 22, c = 2 * Math.PI * r, f = Math.max(0, Math.min(100, score)) / 100;
    return '<svg class="ring ' + verdict + '" viewBox="0 0 56 56" aria-hidden="true"><circle cx="28" cy="28" r="' + r + '" class="tr"/><circle cx="28" cy="28" r="' + r + '" class="fg" stroke-dasharray="' + (c * f).toFixed(1) + ' ' + c.toFixed(1) + '" transform="rotate(-90 28 28)"/><text x="28" y="33" text-anchor="middle">' + score + '</text></svg>';
  }
  function yieldText(m) {
    if (m.yieldHi >= 1000) return t('ton', { n: num(m.yieldLo / 1000, 1) + '–' + num(m.yieldHi / 1000, 1) });
    return t('kg', { n: fmt(m.yieldLo) + '–' + fmt(m.yieldHi) });
  }
  function summaryHTML(C, d) {
    var P = C.plans, b = P[C.best], last = P[0] && P[0].key === 'mine' ? P[0] : null;
    if (last && b === last) return '<div class="verdict good"><span class="big">' + esc(t('sumMineBest', { c: cn(last.cropId) })) + '</span></div>';
    var h = '<div class="verdict good"><span class="pill good" style="align-self:flex-start">' + esc(t('pl_' + b.key)) + '</span><span class="big">' + esc(t('sumBest', { c: cn(b.cropId) })) + '</span>';
    if (!last) return h + '<span>' + esc(t('sumNoLast')) + '</span></div>';
    var pts = [], ds = b.m.score - last.m.score, dw = last.m.gapM3 - b.m.gapM3;
    if (ds > 0) pts.push(t('sumScore', { n: ds }));
    if (d.water !== 'rainfed' && Math.abs(dw) >= 1) pts.push(t(dw > 0 ? 'sumWater' : 'sumWaterMore', { n: fmt(Math.abs(dw)) }));
    if (b.m.soilN > last.m.soilN) pts.push(t('sumSoil'));
    if (last.m.rotN <= 1 && b.m.rotN >= 2) pts.push(t('sumRot'));
    if (b.m.incomeN > last.m.incomeN) pts.push(t('sumIncome'));
    h += '<span style="font-weight:600">' + esc(t('sumVsMine', { c: cn(last.cropId) })) + '</span><ul class="reasons">' + pts.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>';
    return h + '</div>';
  }

    }
    var key = [
      ['row_score', 'score', function (p) { return p.m.score + '%'; }],

    ];
    var more = [

    function rowsHTML(rows) {

    P.forEach(function (p, i) {
      var pos = p.s.pos.slice(0, 4).map(reason), wn = p.s.warn.slice(0, 4).map(reason);
      h += '<details class="card"' + (i === R.pick ? ' open' : '') + '><summary><span class="plabel ' + p.key + '">' + esc(t('pl_' + p.key)) + '</span> ' + esc(t('details', { c: cn(p.cropId) })) + '</summary>';
      if (pos.length) h += '<ul class="reasons">' + pos.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>';
      if (wn.length) h += '<ul class="reasons warn">' + wn.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>';
      h += '</details>';

      case 'lfback': st.lf.err = ''; if (st.lf.step > 1) { st.lf.step -= 1; go('land'); } else { var lid = st.lf.id; st.lf = null; if (lid) { st.sel = lid; go('detail'); } else go('home'); } break;
      case 'editland': editLand(el.getAttribute('data-id')); break;
      case 'plan': f = fieldById(el.getAttribute('data-id')); if (f) newPlan(f); break;
      case 'logout': signOutState(); persist(); go('welcome'); break;
      case 'delaccount':
        if (!st.confirmDel) { st.confirmDel = true; render(); break; }
        delete db.accounts[st.account]; signOutState(); persist(); go('welcome'); break;
      case 'editname': st.editName = true; render(); var ip = document.getElementById('ename'); if (ip) ip.focus(); break;
      case 'savename': var en = document.getElementById('ename'); if (en && en.value.trim()) { st.name = en.value.trim(); st.flash = 'nameSaved'; } st.editName = false; persist(); render(); break;
      case 'tab': if (v === 'home') go('home'); else if (v === 'add') newLand(); else if (v === 'chat') go('chat'); else go('settings'); break;
      case 'ask': chatAsk(v); break;
      case 'send': var ci = document.getElementById('chatin'); if (ci && ci.value.trim()) { var qq = ci.value.trim(); ci.value = ''; chatAsk(qq); } break;
      case 'mic': toggleMic(); break;
      case 'playmsg': var pm = (st.chat || [])[+v]; if (pm) speak(pm.text); break;
      case 'voicetog': st.settings.voiceOn = !st.settings.voiceOn; persist(); if (!st.settings.voiceOn) stopSpeak(); render(); break;
      case 'mtab': st.mTab = v; if (v === 'data' && st.mRegion === 'all') st.mRegion = 'ramallah'; render(); break;
      case 'open': st.sel = el.getAttribute('data-id'); go('detail'); break;
      case 'home': go('home'); break;
      case 'sowlog':
        var sd = document.getElementById('sowdate'), dt = sd && sd.value ? new Date(sd.value + 'T00:00:00') : TODAY;
        if (isNaN(dt) || dt > TODAY) dt = TODAY;
        f = fieldById(st.sel); if (f) { f.sowDate = dt.toISOString(); persist(); } render(); break;
      case 'unsow': f = fieldById(st.sel); if (f) { f.sowDate = null; persist(); } render(); break;
      case 'delfield': st.fields = st.fields.filter(function (x) { return x.id !== st.sel; }); persist(); go('home'); break;
      case 'newfield': newLand(); break;
      case 'pickprio': w.priority = v; render(); break;
      case 'picknote':
        var i = w.notes.indexOf(v);
        if (v === 'unknown') { w.notes = i >= 0 ? [] : ['unknown']; } else { w.notes = w.notes.filter(function (n) { return n !== 'unknown'; }); if (i >= 0) w.notes.splice(w.notes.indexOf(v), 1); else w.notes.push(v); }
        render(); break;
      case 'wiznext': if (wizOk(w)) { w.step += 1; render(); } break;
      case 'wizback': if (w.step > 1) { w.step -= 1; render(); } else { st.sel = w.fid; st.wiz = null; go('detail'); } break;
      case 'wizback2': st.screen = 'wizard'; w.step = WIZ_STEPS; render(); break;
      case 'run': if (wizOk(w)) runAnalysis(); break;
      case 'pickplan': st.result.pick = +v; render(); break;
      case 'moretoggle': st.result.more = !st.result.more; render(); break;
      case 'saveplan': savePlan(); break;
      case 'newcrop': w.sub = 'addcrop'; w.cf = { name: '', cat: 'vegetable', need: 'medium', months: [], cycle: '120' }; render(); break;
      case 'ccancel': w.sub = null; w.cf = null; render(); break;
      case 'ccat': w.cf.cat = v; render(); break;
      case 'cneed': w.cf.need = v; render(); break;
      case 'cmonth': var mi = +v, mp = w.cf.months.indexOf(mi); if (mp >= 0) w.cf.months.splice(mp, 1); else w.cf.months.push(mi); render(); break;
      case 'cadd':
        var cf = w.cf, def = { id: 'c_' + Date.now(), name: cf.name.trim(), cat: cf.cat, need: cf.need, months: cf.months.slice().sort(function (x, y) { return x - y; }), cycle: parseInt(cf.cycle, 10) || 120 };
        E.addCrop(def); st.customCrops.push(def); persist();
        w.myPlan = def.id; w.sub = null; w.cf = null; render(); break;
      case 'delcrop': st.customCrops = st.customCrops.filter(function (c) { return c.id !== el.getAttribute('data-id'); }); E.removeCrop(el.getAttribute('data-id')); persist(); render(); break;
      case 'sw':
        if (st.screen === 'signup') { st.su[v] = !st.su[v]; render(); break; }
        st.settings[v] = !st.settings[v];
        if (v === 'wa' && st.settings.wa && !st.settings.phone) st.settings.phone = st.account;
        persist(); render(); break;
      case 'sheet': st.sheet = true; render(); break;
      case 'closesheet': st.sheet = false; render(); break;
    }
  });
  /* tick: status-bar clock and the resend countdown (updates only those nodes, so typed input is kept) */
  setInterval(function () {
    var ck = document.getElementById('clock'); if (ck) ck.textContent = clockText();
    if (st.screen === 'verify' && st.vf) {
      var rem = Math.max(0, Math.ceil((st.vf.cool - Date.now()) / 1000)), b = document.getElementById('resend');
      if (b) { b.disabled = rem > 0; b.textContent = rem > 0 ? t('vResendIn', { n: rem }) : t('vResend'); }
    }
  }, 1000);
  persist();
  render();
})();

</script>
</body>
</html>
